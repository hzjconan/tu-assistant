# 运行时配置：模型端点、会话行为、知识库版本
runtime:
  # 模型服务端点（OpenAI 兼容），由 `tu serve model` 在本机启动
  model_endpoint: "http://127.0.0.1:8080/v1"
  # 允许连接的端点主机白名单；不在列表内时拒绝启动（宪章原则 III、IV）
  allowed_hosts: ["127.0.0.1", "localhost"]
  # 请求中的模型名；mlx_lm.server 会按它解析仓库，default 表示自动读取
  # artifacts/serve/current.json（tu serve model 每次启动时写入）
  model_name: "default"

session:
  max_questions_per_turn: 5    # 每轮追问问题数上限（FR-011）
  default_article_count: 3     # 普法文章默认篇数（FR-028）
  max_article_count: 10        # 普法文章单次上限（FR-028）

kb:
  # 知识库版本（artifacts/kb/<version>.sqlite）；null = 自动使用 artifacts/kb/ 下最新版本
  # 填入具体版本号（如 "kb-20261119-045641"）即可无代码锁定/回滚版本；CLI --kb-version 可覆盖
  # 注意：新执行 `tu kb import` 生成的初始库尚未包含已确认关联（confirmed_relations=0），
  # 在新库完成关联抽取与确认、或进行同口径评测对比前，建议先将此项锁定为指定版本号
  version: null

paths:
  artifacts: "artifacts"
  eval_cases: "eval/cases"
