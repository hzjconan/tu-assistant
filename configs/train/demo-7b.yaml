# 演示模型：Qwen2.5-7B-Instruct 4bit QLoRA（本机，一晚）
exp_id: null
base_model: "mlx-community/Qwen2.5-7B-Instruct-4bit"
base_license: "Apache-2.0"
hardware: "M1 Pro / 32GB"

data: "artifacts/datasets/latest"

batch_size: 1
epochs: 2
learning_rate: 0.00001
max_seq_length: 2048
grad_checkpoint: true          # 长样本必须开（实测 23GB → 11.5GB）
seed: 42

lora:
  rank: 8
  alpha: 16
  scale: 10.0
  dropout: 0.0
  num_layers: -1               # -1 = 全部线性层
