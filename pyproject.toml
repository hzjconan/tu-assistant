[project]
name = "tu-assistant"
version = "0.1.0"
description = "工会法律条款智能助手（POC）：条款咨询与普法文章生成"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-lm>=0.32.0",
    "typer>=0.15.0",
    "pyyaml>=6.0.2",
    "python-docx>=1.1.2",
    "pdfplumber>=0.11.4",
    "beautifulsoup4>=4.12.3",
    "openai>=1.58.0",
    "gradio>=5.9.0",
]

[project.scripts]
tu = "tu_assistant.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tu_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["tu_assistant"]
